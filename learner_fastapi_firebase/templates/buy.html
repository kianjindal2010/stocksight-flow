{% extends "layout.html" %}

{% block title %} - Buy{% endblock %}

{% block main %}
<div class="trade-page">
    <div class="card trade-card">
        <div class="trade-card-header">
            <h2 class="trade-title mb-1">Buy Shares</h2>
            <p class="trade-subtitle mb-0">Search by ticker or company name. We'll resolve it for you live.</p>
        </div>
        <div class="trade-card-body">
            <form method="post" action="/buy">
                <div class="mb-3">
                    <label class="form-label fw-semibold">Stock</label>
                    <input class="form-control" name="symbol" placeholder="e.g. Apple or AAPL" required>
                    <div class="chip mt-2">Market: {{ market }}</div>
                </div>
                <div class="mb-3">
                    <label class="form-label fw-semibold">Shares</label>
                    <input class="form-control" name="quantity" type="number" min="1" placeholder="Number of shares" required>
                </div>
                <div class="mb-3">
                    <label class="form-label fw-semibold">Notes (optional)</label>
                    <input class="form-control" name="notes" placeholder="Why are you entering this trade?">
                </div>
                <div class="mb-3">
                    <label class="form-label fw-semibold">Stop Loss Price (optional)</label>
                    <input class="form-control" name="stop_loss_price" type="number" min="0.01" step="0.01" placeholder="e.g. 95.00">
                </div>
                <div class="mb-3">
                    <label class="form-label fw-semibold">Trailing Stop % (optional)</label>
                    <input class="form-control" name="trailing_stop_percent" type="number" min="0.01" step="0.01" placeholder="e.g. 2">
                    <div class="form-text">Use either trailing percent or trailing amount.</div>
                </div>
                <div class="mb-3">
                    <label class="form-label fw-semibold">Trailing Stop Amount (optional)</label>
                    <input class="form-control" name="trailing_stop_amount" type="number" min="0.01" step="0.01" placeholder="e.g. 5.00">
                </div>
                <div class="d-flex gap-2">
                    <button class="btn btn-primary" type="submit">Place Buy Order</button>
                    <a class="btn btn-outline-secondary" href="/">Back to Dashboard</a>
                </div>
            </form>
        </div>
    </div>
</div>
{% endblock %}
