{% extends "layout.html" %}

{% block title %} - Reset password{% endblock %}

{% block guest_main %}
<section class="login-shell" style="grid-template-columns:minmax(320px, 560px);justify-content:center">
  <div class="login-card">
    <h1>Choose a new StockSight password</h1>
    <p class="text-muted">This password is for StockSight. It does not change your Google password.</p>
    <form id="resetForm">
      <div class="mb-3"><label class="form-label" for="password">New password</label><input class="form-control" id="password" type="password" autocomplete="new-password" minlength="8" required></div>
      <div class="mb-3"><label class="form-label" for="confirmPassword">Confirm new password</label><input class="form-control" id="confirmPassword" type="password" autocomplete="new-password" minlength="8" required></div>
      <button class="btn btn-primary" type="submit">Save new password</button>
    </form>
    <p id="resetMessage" class="small mt-3" role="status" aria-live="polite"></p>
  </div>
</section>
<script>
const params = new URLSearchParams(window.location.search);
const message = document.getElementById("resetMessage");
document.getElementById("resetForm").addEventListener("submit", async (event) => {
  event.preventDefault();
  if (!params.get("userId") || !params.get("secret")) {
    message.className = "small mt-3 text-danger";
    message.textContent = "This reset link is incomplete. Request a new password reset from StockSight.";
    return;
  }
  const password = document.getElementById("password").value;
  if (password !== document.getElementById("confirmPassword").value) {
    message.className = "small mt-3 text-danger";
    message.textContent = "The passwords do not match.";
    return;
  }
  try {
    const response = await fetch("/api/auth/password-reset/confirm", {
      method: "POST", headers: {"Content-Type":"application/json"},
      body: JSON.stringify({user_id: params.get("userId"), secret: params.get("secret"), password}),
    });
    const data = await response.json().catch(() => ({}));
    if (!response.ok) throw new Error(data.detail || "The reset link is invalid or expired.");
    message.className = "small mt-3 text-success";
    message.innerHTML = 'Password saved. <a href="/login">Return to StockSight sign in</a>.';
    event.target.reset();
  } catch (error) {
    message.className = "small mt-3 text-danger";
    message.textContent = error.message || "The reset link is invalid or expired.";
  }
});
</script>
{% endblock %}
